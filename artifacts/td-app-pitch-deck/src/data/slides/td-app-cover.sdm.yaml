format: replit.sdm
version: 1
size:
  width: 1920
  height: 1080
background:
  kind: linearGradient
  angleDeg: 135
  stops:
    - offset: 0
      color:
        kind: rgb
        value: "#f7f2ff"
    - offset: 0.58
      color:
        kind: rgb
        value: "#e9ddff"
    - offset: 1
      color:
        kind: rgb
        value: "#c6b1ff"
theme:
  colors:
    tinta: "#1a0a2e"
    morado: "#7c3aed"
    lila: "#c6b1ff"
    turquesa: "#62ddca"
    rosa: "#f2a5d1"
    ambar: "#f7ba67"
    crema: "#f7f2ff"
  fonts:
    display: Space Grotesk
    body: DM Sans
assets:
  logo:
    src: assets/td-app-logo.png
    mimeType: image/png
elements:
  - id: orb
    type: shape
    frame:
      x: 1310
      y: -120
      width: 760
      height: 760
    geometry:
      kind: preset
      preset: ellipse
    fill:
      kind: solid
      color:
        kind: rgb
        value: "#f2a5d1"
      opacity: 0.45
  - id: orb2
    type: shape
    frame:
      x: 1500
      y: 680
      width: 330
      height: 330
    geometry:
      kind: preset
      preset: ellipse
    fill:
      kind: solid
      color:
        kind: rgb
        value: "#62ddca"
      opacity: 0.8
  - id: logo
    type: image
    frame:
      x: 1420
      y: 130
      width: 330
      height: 330
    altText: "Logo de TD-App: una figura tranquila con un cerebro y el nombre TD-App"
    assetId: logo
    fit: contain
  - id: eyebrow
    type: text
    frame:
      x: 150
      y: 150
      width: 760
      height: 80
    body:
      paragraphs:
        - runs:
            - text: PRESENTACIÓN PARA JUECES
              font:
                kind: family
                family: DM Sans
              sizePt: 16
              weight: 700
              color:
                kind: rgb
                value: "#7c3aed"
              letterSpacingPt: 3
  - id: title
    type: text
    frame:
      x: 145
      y: 260
      width: 1080
      height: 210
    body:
      verticalAlign: middle
      paragraphs:
        - runs:
            - text: TD-App
              font:
                kind: family
                family: Space Grotesk
              sizePt: 78
              weight: 700
              color:
                kind: rgb
                value: "#1a0a2e"
  - id: promise
    type: text
    frame:
      x: 150
      y: 500
      width: 1050
      height: 215
    body:
      paragraphs:
        - runs:
            - text: |-
                Pequeños pasos.
                Avances visibles.
              font:
                kind: family
                family: Space Grotesk
              sizePt: 39
              weight: 600
              color:
                kind: rgb
                value: "#7c3aed"
  - id: sub
    type: text
    frame:
      x: 137
      y: 733
      width: 760
      height: 170
    body:
      paragraphs:
        - runs:
            - text: Un acompañante ligero y cercano para organizarse y enfocar sin juicio.
              font:
                kind: family
                family: DM Sans
              sizePt: 22
              weight: 500
              color:
                kind: rgb
                value: "#655b76"
  - id: line
    type: line
    frame:
      x: 155
      y: 905
      width: 1160
      height: 6
    stroke:
      color:
        kind: rgb
        value: "#7c3aed"
      widthPt: 3
      cap: round
    points:
      - x: 0
        y: 0
      - x: 1160
        y: 0
